version: "3.7"

services:
  # Not a container on umbrelOS 2: configures the built-in gateway that serves
  # the status page on the app's port, behind the Umbrel login.
  app_proxy:
    environment:
      APP_HOST: localinfra-health_server_1
      APP_PORT: 3000

  server:
    # Stock image (same base as yarg's); the app is the single file next to this one
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    restart: on-failure
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: 3000
      # No Docker socket in this container: it talks to socket-proxy, which only lets the few
      # read-only GETs listed below through
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - ${APP_DATA_DIR}/server.mjs:/app/server.mjs:ro
    depends_on:
      - socket-proxy
    # Unprivileged: the node user, no root, no capabilities, read-only FS.
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # Read-only gate to the Docker API (wollomatic/socket-proxy, pinned by version and digest). A
  # read-only mount does not restrict the Docker API, so whoever got code execution in `server`
  # would control the host. The proxy holds the socket instead and answers only GETs whose path
  # matches the regex below, from `server` alone; everything else (POST, DELETE, /exec,
  # /images, ...) gets 403. Needed: /containers/json, /containers/<id>/stats, /json and /archive.
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: on-failure
    command:
      - -listenip=0.0.0.0
      - -allowfrom=localinfra-health_server_1
      - -allowGET=^(/v[0-9.]+)?/containers/(json|[a-f0-9]{12,64}/(stats|json|archive))$$
      - -logjson
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Unprivileged: nobody plus the host's docker group (gid 987 on umbrelOS) to read the socket.
    # No published ports: only `server` reaches it, over the app's network.
    user: "65534:65534"
    group_add:
      - "987"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
