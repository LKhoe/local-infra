<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khoe.dev</title>
<meta name="description" content="Meus apps: YARG Aggregator, Minhas Receitas, Sports Cal e Brain Gym.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06080b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/apple-touch-icon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css?v=7">
<script src="/fx.js?v=7" defer></script>
</head>
<body>
<!-- Water: SVG turbulence filters (icon ripple, leaving transition); the background caustics are water.webp, pre-rendered from the same kind of filter -->
<svg class="fx-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- gentle water wobble, for icons on hover -->
    <filter id="ripple" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.06" numOctaves="1" seed="2">
        <animate attributeName="baseFrequency" dur="6s" values="0.03 0.06;0.05 0.09;0.03 0.06" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
    </filter>
    <!-- leaving for an app: the page dissolves like water (scale animated by fx.js) -->
    <filter id="melt" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="2" seed="4"/>
      <feDisplacementMap id="melt-map" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="depths" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="water" aria-hidden="true"><span></span></div>

<main class="wrap">
  <header class="hero">
    <div class="logo-wrap">
      <span class="ring" aria-hidden="true"></span>
      <img class="logo" src="/logo-120.png" width="88" height="88" alt="Logo do khoe.dev">
    </div>
    <h1 class="title"><span class="title-text">khoe.dev</span><canvas class="title-canvas" aria-hidden="true"></canvas></h1>
  </header>

  <ul class="cards">
    <li>
      <a class="card" href="https://yarg.khoe.dev">
        <span class="spot" aria-hidden="true"></span>
        <img class="icon" src="/icons/yarg.png" width="56" height="56" alt="">
        <span class="text">
          <span class="name">YARG Aggregator</span>
          <span class="desc">Busca de charts do YARG (Enchor.us, Rhythmverse)</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="card" href="https://recipes.khoe.dev">
        <span class="spot" aria-hidden="true"></span>
        <img class="icon" src="/icons/recipes.svg" width="56" height="56" alt="">
        <span class="text">
          <span class="name">Minhas Receitas</span>
          <span class="desc">Receitas da família e dos amigos (só com convite)</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="card" href="https://sports.khoe.dev">
        <span class="spot" aria-hidden="true"></span>
        <img class="icon" src="/icons/sports.svg" width="56" height="56" alt="">
        <span class="text">
          <span class="name">Sports Cal</span>
          <span class="desc">Agenda esportiva com notificações</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="card" href="https://brain-gym.khoe.dev">
        <span class="spot" aria-hidden="true"></span>
        <img class="icon" src="/icons/brain-gym.svg" width="56" height="56" alt="">
        <span class="text">
          <span class="name">Brain Gym</span>
          <span class="desc">Jogos e quizzes diários</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>

  <footer class="foot">
    <a class="github" href="https://github.com/LKhoe" rel="me noopener">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>github.com/LKhoe</span>
    </a>
  </footer>
</main>

<div class="veil" aria-hidden="true"><span class="veil-label"></span></div>
</body>
</html>
