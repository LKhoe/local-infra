# Static site only: GET/HEAD, no upstreams; one same-origin script (fx.js, visual effects). Runs read-only as the nginx user.
server_tokens off;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers ("always": 404/405 pages get them too). No add_header inside the locations
    # below, so these are inherited (nginx drops inherited add_header when a block sets its own).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Only GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    # Pages: always revalidate, so a deploy shows up at once.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    # Assets (css, icons): cached for a day.
    location ~* \.(?:css|js|svg|png|ico|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
