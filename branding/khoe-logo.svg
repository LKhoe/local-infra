<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="KhoE Apps">
  <rect width="512" height="512" rx="104" fill="#0f172a"/>

  <!-- three rack units, outlined -->
  <g fill="none" stroke="#f1f5f9" stroke-width="12">
    <rect x="112" y="120" width="288" height="72" rx="18"/>
    <rect x="112" y="220" width="288" height="72" rx="18"/>
    <rect x="112" y="320" width="288" height="72" rx="18"/>
  </g>

  <!-- status lights: one active -->
